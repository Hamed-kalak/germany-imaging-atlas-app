# Security headers, in a file because of an nginx rule that catches everyone:
# `add_header` does NOT inherit into a location that declares its own
# add_header. Any location below that sets a cache header would silently lose
# every header set at server level. So each of them includes this instead.
#
# The content policy is as tight as the app allows:
#   script-src 'self'   — no CDN, no inline script; the bundle is local.
#   style-src  'self' 'unsafe-inline'
#                       — React sets element styles as attributes and the page
#                         shell carries an inline <style> for the first paint.
#   img-src    'self' data:
#                       — the favicon is an inline SVG data URI.
#   font-src   'self'   — Inter is bundled, deliberately: a page served from a
#                         hospital should not hand every visitor's IP address
#                         to a font CDN.
#   connect-src 'self'  — the only fetch the app makes is its own data file.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
