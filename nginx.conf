# Imaging Atlas — static site server.
#
# Four things this file is careful about, each of them a way the deployment
# would otherwise fail quietly:
#
#   1. A missing asset must 404, not return index.html. With a blanket SPA
#      fallback, a data file that failed to deploy answers 200 with HTML, and
#      the app reports a JSON parse error at character 1 of something that is
#      not the data. /assets/ is therefore terminal.
#   2. index.html must not be cached. It names the hashed assets; a cached copy
#      pins a browser to the previous deployment forever.
#   3. Hashed assets can be cached for a year. Their name changes when their
#      content does, so revalidation buys nothing.
#   4. The 18 MB dataset is served pre-compressed (gzip_static), built once at
#      image build. gzip stays on for anything not pre-compressed.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Pre-compressed first; compress the rest on the fly.
    gzip_static on;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;

    # The dataset is large and some clients are slow.
    client_max_body_size 1m;
    sendfile on;
    tcp_nopush on;

    # ── liveness ──────────────────────────────────────────────────────────
    # Used by the container HEALTHCHECK and by whatever watches the VM. Kept
    # out of the access log so it does not bury real traffic.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ── what this build is ────────────────────────────────────────────────
    # Written by `npm run stamp`: data hash, row count, commit, gate verdicts.
    # Never cached — it is the question "which version am I looking at?".
    location = /build.json {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
        default_type application/json;
        try_files $uri =404;
    }

    # ── hashed assets ─────────────────────────────────────────────────────
    # Terminal: no SPA fallback here. A missing file is a deployment fault and
    # must look like one.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # ── the page shell ────────────────────────────────────────────────────
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # ── everything else ───────────────────────────────────────────────────
    # The app has no client-side router, but a stray path should still land on
    # the atlas rather than on an nginx error page.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
