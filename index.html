    <!-- Inter is bundled (see src/main.tsx), not fetched from fonts.googleapis.com:
         a page served from a German institution should not hand every visitor's
         IP address to a third party, and a published research artefact should
         not stop rendering correctly if that third party changes. -->
    <style>
      /* Instant first-paint loader, shown before the JS bundle mounts React. */
      #boot { position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px;
        font-family: Inter, system-ui, sans-serif; color: #64748b; }
      #boot .s { width: 34px; height: 34px; border-radius: 50%;
        border: 3px solid #e2e8f0; border-top-color: #2FA6A0;
        animation: bs 0.8s linear infinite; }
      @keyframes bs { to { transform: rotate(360deg); } }
    </style>

  <body>
    <div id="root"><div id="boot"><div class="s"></div><div>Loading the Germany Imaging Atlas…</div></div></div>
